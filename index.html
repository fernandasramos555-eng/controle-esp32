<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de LED - ESP32</title>
    <!-- Importando o Bootstrap para deixar o design bonito e moderno -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .btn-custom {
            font-size: 1.2rem;
            padding: 12px 30px;
            border-radius: 50px;
        }
    </style>
</head>
<body>

    <div class="container text-center">
        <div class="card p-5 mx-auto" style="max-width: 400px;">
            <h2 class="mb-4 text-primary">Painel ESP32</h2>
            <p class="text-muted mb-4">Status atual: <span id="statusLed" class="fw-bold">Carregando...</span></p>
            
            <div class="d-grid gap-3">
                <button onclick="controlarLed(1)" class="btn btn-success btn-custom">Ligar LED</button>
                <button onclick="controlarLed(0)" class="btn btn-danger btn-custom">Desligar LED</button>
            </div>
        </div>
    </div>

    <!-- Importando os scripts do Firebase (Versão compatível com Web Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // --- SUBSTITUA COM AS CREDENCIAIS DO SEU FIREBASE ---
        const firebaseConfig = {
            apiKey: "SUA_API_KEY_AQUI",
            authDomain: "fereana-60625.firebaseapp.com",
            databaseURL: "https://fereana-60625-default-rtdb.firebaseio.com",
            projectId: "fereana-60625",
            storageBucket: "fereana-60625.appspot.com",
            messagingSenderId: "SEU_MESSAGING_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        // Inicializa o Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Função global para ligar/desligar o LED ao clicar nos botões
        window.controlarLed = function(estado) {
            set(ref(db, 'led'), estado)
                .then(() => {
                    console.log("Comando enviado com sucesso: " + estado);
                })
                .catch((error) => {
                    console.error("Erro ao atualizar: ", error);
                });
        };

        // Monitora em tempo real o status do LED no banco para atualizar a interface visual
        const ledRef = ref(db, 'led');
        onValue(ledRef, (snapshot) => {
            const data = snapshot.val();
            const statusSpan = document.getElementById('statusLed');
            if (data === 1) {
                statusSpan.innerText = "LIGADO 🟢";
                statusSpan.className = "fw-bold text-success";
            } else {
                statusSpan.innerText = "DESLIGADO 🔴";
                statusSpan.className = "fw-bold text-danger";
            }
        });
    </script>

</body>
</html>
